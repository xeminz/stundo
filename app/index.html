<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stundo</title>
<meta name="description" content="Hausübungen, Tests und Stundenplan, auf Laptop und Handy.">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stundo">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --paper: #f7f3ec; --paper-2: #efe8dc; --card: #fffdf8; --ink: #1f1b16; --muted: #6d655b;
    --line: #e2d9ca; --accent: #2457d6; --accent-soft: #e3eafc; --warn: #c2410c; --warn-soft: #fde8da;
    --ok: #2f7d4f; --ok-soft: #dcefe2; --danger: #b42318; --danger-soft: #fde2df;
    --shadow: 0 1px 0 rgba(31,27,22,.06), 0 10px 26px -14px rgba(31,27,22,.28);
    --tabbar: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17140f; --paper-2: #1f1b15; --card: #26211a; --ink: #f1ebe0; --muted: #a89d8e;
      --line: #383128; --accent: #7ea2ff; --accent-soft: #1f2a46; --warn: #ff8a4c; --warn-soft: #3a2316;
      --ok: #5cc28a; --ok-soft: #1d3326; --danger: #ff7b6e; --danger-soft: #3d1c19;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.65);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; min-height: 100dvh;
         background: radial-gradient(800px 420px at 95% -10%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%), var(--paper);
         padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px); }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 0; }

  header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header.top h1 { font-size: 26px; flex: 1; }
  header.top .date { color: var(--muted); font-size: 14px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
  .iconbtn svg { width: 20px; height: 20px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .sync-dot.ok { background: var(--ok); } .sync-dot.err { background: var(--danger); } .sync-dot.busy { background: var(--warn); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
             background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px);
             border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs .inner { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 760px; }
  nav.tabs button { border: 0; background: none; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); position: relative; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  nav.tabs .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 19px; margin-bottom: 10px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 2px 10px; }
  .section-head h2 { font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 10px; font-size: 15px; }

  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0d1430; } }
  .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .btn.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .btn.danger { color: var(--danger); }
  .btn.big { padding: 14px 16px; font-size: 17px; border-radius: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }
  .row.tools > .btn { flex: 0 0 auto; padding: 8px 12px; font-size: 14px; }

  /* HÜ-Check auf "Heute" */
  .check { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: linear-gradient(135deg, var(--accent-soft), var(--card) 70%); }
  .check.done { background: var(--card); border-color: var(--line); }
  .check p { margin: 0 0 12px; }

  /* Listen */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: flex-start; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .item .main { flex: 1; min-width: 0; cursor: pointer; }
  .item .title { font-weight: 600; overflow-wrap: anywhere; }
  .item .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .item.done .title { text-decoration: line-through; color: var(--muted); }
  .tick { width: 28px; height: 28px; flex: none; border-radius: 9px; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; margin-top: 1px; }
  .tick svg { width: 16px; height: 16px; opacity: 0; color: #fff; }
  .item.done .tick { background: var(--ok); border-color: var(--ok); }
  .item.done .tick svg { opacity: 1; }
  .subj, .subj-cell { --subj-bg: hsl(var(--h, 30) 75% 91%); --subj-fg: hsl(var(--h, 30) 55% 28%); }
  @media (prefers-color-scheme: dark) { .subj, .subj-cell { --subj-bg: hsl(var(--h, 30) 35% 22%); --subj-fg: hsl(var(--h, 30) 70% 80%); } }
  .subj { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--subj-bg); color: var(--subj-fg); white-space: nowrap; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper-2); color: var(--muted); }
  .pill.late { background: var(--danger-soft); color: var(--danger); }
  .pill.soon { background: var(--warn-soft); color: var(--warn); }

  /* Tests */
  .test { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; cursor: pointer; }
  .count { text-align: center; border-radius: 14px; padding: 8px 4px; background: var(--paper-2); }
  .count b { display: block; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 1; }
  .count span { font-size: 11px; color: var(--muted); }
  .count.near { background: var(--warn-soft); color: var(--warn); } .count.near span { color: var(--warn); }
  .count.now { background: var(--danger-soft); color: var(--danger); } .count.now span { color: var(--danger); }
  .progress { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin-top: 6px; }
  .progress i { display: block; height: 100%; background: var(--ok); }
  .past { opacity: .55; }

  /* Stundenplan */
  .daypick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .daypick button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 0; font-weight: 600; }
  .daypick button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .daypick button[aria-pressed="true"] small { color: #fff; }
  .lesson { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .lesson:last-child { border-bottom: 0; }
  .lesson .t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .lesson .n { font-weight: 600; }
  .lesson.now { background: var(--accent-soft); margin: 0 -10px; padding: 10px; border-radius: 10px; }
  .lesson .flag { font-size: 12px; font-weight: 700; color: var(--danger); }
  .week { display: none; }
  @media (min-width: 900px) {
    .wrap.wide { max-width: 1100px; }
    .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .week + .dayview { display: none; }
    .daypick.onlymobile { display: none; }
    .week .col h3 { font-size: 15px; font-family: Inter, sans-serif; margin: 0 0 6px; }
    .week .cell { border-radius: 10px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px; background: var(--subj-bg); color: var(--subj-fg); }
    .week .cell b { display: block; }
  }

  /* Dialoge */
  dialog { border: 0; padding: 0; background: var(--card); color: var(--ink); border-radius: 22px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 40px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
  dialog::backdrop { background: rgba(20,16,10,.45); backdrop-filter: blur(2px); }
  @media (max-width: 600px) {
    dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  }
  .dlg { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .dlg h2 { font-size: 22px; }
  .dlg .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .inp { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 12px; font-size: 16px; color: var(--ink); }
  textarea.inp { min-height: 96px; resize: vertical; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .plan { display: flex; flex-direction: column; gap: 6px; }
  .plan .item { padding: 10px; }
  .plan .date { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
  .codebox { font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: .06em; background: var(--paper); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; text-align: center; user-select: all; }
  .note { font-size: 14px; background: var(--paper-2); border-radius: 12px; padding: 10px 12px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }

  /* Stundenplan verbinden */
  .src { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
  .src-h { display: flex; flex-direction: column; gap: 1px; }
  .tt-day { border-top: 1px solid var(--line); padding: 10px 0 6px; }
  .tt-dh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .tt-row { display: grid; grid-template-columns: 1.2fr 92px 92px 1fr 36px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .tt-row .inp { padding: 8px 8px; font-size: 15px; border-radius: 10px; min-width: 0; }
  .tt-row .iconbtn { width: 36px; height: 36px; border-radius: 10px; }
  .tt-row .iconbtn svg { width: 16px; height: 16px; }
  .sm-add { padding: 6px 12px; font-size: 14px; }
  @media (max-width: 520px) {
    .tt-row { grid-template-columns: 1fr 1fr 1fr 36px; row-gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
    .tt-row .tt-f { grid-column: 1 / 4; grid-row: 1; }
    .tt-row .tt-del { grid-column: 4; grid-row: 1; }
    .tt-row .tt-s { grid-column: 1; grid-row: 2; }
    .tt-row .tt-e { grid-column: 2; grid-row: 2; }
    .tt-row .tt-r { grid-column: 3 / 5; grid-row: 2; }
    .tt-row .inp { padding: 7px 6px; font-size: 14px; }
  }
  #toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; pointer-events: none; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div style="flex:1">
      <h1 id="title">Heute</h1>
      <div class="date" id="today-label"></div>
    </div>
    <button class="iconbtn" id="btn-settings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="inner" role="tablist">
  <button role="tab" data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</button>
  <button role="tab" data-tab="hue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>HÜs<span class="badge" id="badge-hue" hidden></span></button>
  <button role="tab" data-tab="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Tests</button>
  <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Stundenplan</button>
</div></nav>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="timetable.js"></script>
<script src="app.js"></script>
</body>
</html>
